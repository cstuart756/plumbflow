name: Bug Report
description: Report something that is broken.
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: "1. \n2. \n3. "