name: Feature / User Story
description: Propose a new feature or capability.
title: "feat: "
labels: ["type:feature", "priority:must-have"]
body:
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: "As a [role], I want [feature] so that [benefit]."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: "What must be true for this to be considered done?"
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Technical Context
      description: "Links to wireframes, DB schema, or API contracts."